<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distance Sampling — Ecology Demos</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <nav class="navbar">
    <span class="nav-title">Ecology Demos</span>
    <a href="/ecodemos/">Home</a>
    <a href="/ecodemos/ds/">Distance Sampling</a>
    <a href="/ecodemos/secr/" class="nav-disabled">SECR (coming soon)</a>
  </nav>

  <div class="module-layout">

    <div class="pane-sim" id="sim-container">
      <!-- p5.js canvas renders here -->
    </div>

    <div class="pane-controls">
      <!-- TODO: playback controls, sliders, toggles, presets, seed -->
      <p class="placeholder">Controls coming soon.<br><br>
        <kbd>Space</kbd> play / pause<br>
        <kbd>R</kbd> reset
      </p>
    </div>

    <div class="pane-analytics">
      <div class="analytics-panels">

        <!-- 1. Detection function -->
        <div class="analytics-panel panel-detection-fn">
          <h3 class="panel-title">Detection function</h3>
          <div class="chart-area" id="chart-detection-fn"></div>
        </div>

        <!-- 2. Running estimates -->
        <div class="analytics-panel panel-estimates">
          <h3 class="panel-title">Estimates</h3>
          <dl class="estimates-list">
            <dt>Detections (n)</dt>
            <dd id="est-n">—</dd>

            <dt>Effort (L)</dt>
            <dd id="est-effort">—</dd>

            <dt>ESW</dt>
            <dd id="est-esw">—</dd>

            <dt>D̂</dt>
            <dd id="est-dhat">—</dd>
          </dl>
        </div>

        <!-- 3. D̂ convergence -->
        <div class="analytics-panel panel-dhat">
          <h3 class="panel-title">D̂ convergence</h3>
          <div class="chart-area" id="chart-dhat"></div>
        </div>

      </div>
    </div>

  </div>

  <!-- Libraries (globals) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>

  <!-- Engine + sketch + analytics (ES modules share the same state singleton) -->
  <script type="module" src="sketch.js"></script>
  <script type="module">
    import { initAnalytics } from './analytics.js';
    initAnalytics();
  </script>

</body>
</html>
