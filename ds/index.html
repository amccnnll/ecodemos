<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distance Sampling — Ecology Demos</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <nav class="navbar">
    <span class="nav-title">Ecology Demos</span>
    <a href="/ecodemos/">Home</a>
    <a href="/ecodemos/ds/">Distance Sampling</a>
    <a href="/ecodemos/secr/" class="nav-disabled">SECR (coming soon)</a>
  </nav>

  <div class="module-layout">

    <div class="pane-sim" id="sim-container">
      <!-- p5.js canvas renders here -->
    </div>

    <div class="pane-controls">

      <!-- Playback controls -->
      <div class="controls-section">
        <div class="playback-row">
          <button id="btn-playpause" class="btn-primary">▶ Play</button>
          <button id="btn-reset" class="btn-secondary">↺ Reset</button>
        </div>
        <div class="speed-row">
          <span class="control-label">Speed</span>
          <div class="btn-group">
            <button class="btn-speed" data-speed="slow">Slow</button>
            <button class="btn-speed active" data-speed="normal">Normal</button>
            <button class="btn-speed" data-speed="fast">Fast</button>
          </div>
        </div>
      </div>

      <div class="controls-divider"></div>

      <!-- Placeholder for parameter controls -->
      <p class="placeholder">Parameter controls coming soon.</p>

    </div>

    <div class="pane-analytics">
      <div class="analytics-panels">

        <!-- 1. Detection function -->
        <div class="analytics-panel panel-detection-fn">
          <h3 class="panel-title">Detection function</h3>
          <div class="chart-area" id="chart-detection-fn"></div>
        </div>

        <!-- 2. Running estimates -->
        <div class="analytics-panel panel-estimates">
          <h3 class="panel-title">Estimates</h3>
          <dl class="estimates-list">
            <dt>Detections (n)</dt>
            <dd id="est-n">—</dd>

            <dt>Effort (L)</dt>
            <dd id="est-effort">—</dd>

            <dt>ESW</dt>
            <dd id="est-esw">—</dd>

            <dt class="estimate-row">D̂</dt>
            <dd id="est-dhat" class="estimate-row">—</dd>

            <dt class="true-row">True D</dt>
            <dd id="est-trued" class="true-row">—</dd>
          </dl>
        </div>

        <!-- 3. D̂ convergence -->
        <div class="analytics-panel panel-dhat">
          <h3 class="panel-title">D̂ convergence</h3>
          <div class="chart-area" id="chart-dhat"></div>
        </div>

      </div>
    </div>

  </div>

  <!-- Libraries (globals) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>

  <!-- Engine + sketch + analytics (ES modules share the same state singleton) -->
  <script type="module" src="sketch.js"></script>
  <script type="module">
    import { initAnalytics } from './analytics.js';
    initAnalytics();
  </script>

</body>
</html>
